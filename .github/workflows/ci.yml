name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Portfolio.World/package-lock.json
      - name: Build 3D world
        working-directory: src/Portfolio.World
        run: npm ci --no-audit --no-fund && npm run build
      - run: dotnet restore Portfolio.slnx
      - run: dotnet build Portfolio.slnx --no-restore -c Release
      - run: dotnet test Portfolio.slnx --no-build -c Release
