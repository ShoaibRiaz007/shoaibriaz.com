# Builds the site and runs the test suite on every pull request and on pushes to main.
# The job is named build-and-test; make it a required status check on main (Settings > Rules > Rulesets) so a pull
# request can only merge when it passes.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the run in progress; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Portfolio.World/package-lock.json
      - name: Build 3D world
        working-directory: src/Portfolio.World
        run: npm ci --no-audit --no-fund && npm run build
      - run: dotnet restore Portfolio.slnx
      - run: dotnet build Portfolio.slnx --no-restore -c Release
      - name: Test
        run: >
          dotnet test Portfolio.slnx --no-build -c Release
          --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"
          --results-directory TestResults
      - name: Test summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          files = glob.glob('TestResults/**/*.trx', recursive=True)
          if not files:
              print('### Tests did not run'); raise SystemExit
          total = passed = 0; failed = []
          for f in files:
              root = ET.parse(f).getroot()
              c = root.find('.//t:Counters', ns)
              total += int(c.get('total')); passed += int(c.get('passed'))
              for r in root.iterfind('.//t:UnitTestResult', ns):
                  if r.get('outcome') == 'Failed':
                      msg = r.find('.//t:Message', ns)
                      failed.append((r.get('testName'), (msg.text or '').strip().splitlines()[0] if msg is not None and msg.text else ''))
          print(f"### Tests: {passed} of {total} passed" + (f", {len(failed)} failed" if failed else ""))
          for name, msg in failed[:50]:
              print(f"- ❌ `{name}`: {msg}")
          EOF
      - name: Keep test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 7
