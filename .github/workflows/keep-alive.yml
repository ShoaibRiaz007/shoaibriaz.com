# Pings the site every 14 minutes so the free web instance never reaches its 15-minute idle spin-down.
# Scheduled runs are best effort on GitHub (they can start a few minutes late under load), and GitHub
# pauses schedules after 60 days without repository activity; re-enable from the Actions tab if so.
# Set the repository variable SITE_URL to change the target (defaults to the Render address).
name: Keep alive

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://shoaibriaz-com.onrender.com' }}
        run: |
          # A sleeping instance takes up to a minute to wake, so allow for it and retry a few times.
          curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 15 --retry-all-errors \
            "$SITE_URL/health"
